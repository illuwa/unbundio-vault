name: UnbundioVault

options:
  bundleIdPrefix: com.unbundio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  UnbundioVault:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: .
        excludes:
          - Sources/**
          - project.yml
          - build.sh
          - check-abi.sh

    settings:
      base:
        PRODUCT_NAME: unbundio-vault
        PRODUCT_BUNDLE_IDENTIFIER: com.unbundio.vault
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # Rust core: C ABI in src/ffi.rs, surfaced to Swift as a bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/UnbundioVault.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources"
        UV_CORE_DIR: "$(SRCROOT)/../.."
        LIBRARY_SEARCH_PATHS: "$(UV_CORE_DIR)/target/$(UV_RUST_TARGET)/release"
        OTHER_LDFLAGS: "-lunbundio_vault"
      configs:
        # The static library is target-specific; the Rust triple must match the
        # Xcode SDK exactly or the link fails with an architecture mismatch.
        Debug:
          UV_RUST_TARGET: aarch64-apple-ios-sim
        Release:
          UV_RUST_TARGET: aarch64-apple-ios

    preBuildScripts:
      - name: Build Rust core (staticlib)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$UV_CORE_DIR"
          cargo build --release --lib --target "$UV_RUST_TARGET"
          test -f "target/$UV_RUST_TARGET/release/libunbundio_vault.a"